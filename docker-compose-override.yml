# Local development only. Load explicitly together with docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose-override.yml up --build
# Production uses only docker-compose.yml.
services:
  backend:
    command: ["npm", "run", "dev", "--", "--legacy-watch"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./api:/app
      - /app/node_modules
